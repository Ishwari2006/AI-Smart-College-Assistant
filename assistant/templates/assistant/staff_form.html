<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #162d6b;
        }

        .back {
            text-decoration: none;
            color: white;
            background: #6b7280;
            padding: 12px 20px;
            border-radius: 6px;
            margin-left: 10px;
        }

        .back:hover {
            background: #4b5563;
        }

        .errorlist {
            color: red;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>{{ title }}</h1>
</div>

<div class="container">

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="buttons">
            <button type="submit">Save</button>

            <a href="javascript:history.back()" class="back">
                Cancel
            </a>
        </div>
    </form>

</div>

</body>
</html>
