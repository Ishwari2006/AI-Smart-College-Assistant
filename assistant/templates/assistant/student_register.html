<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Register - AI Smart College Assistant
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #f5f3ff
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .register-container {

            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.12);
        }

        .logo {

            text-align: center;

            font-size: 45px;

            margin-bottom: 12px;
        }

        h1 {

            text-align: center;

            color: #4c1d95;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 28px;
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #334155;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 14px;
        }

        input:focus {

            border-color: #6d28d9;

            box-shadow:
                0 0 0 3px
                rgba(109, 40, 217, 0.1);
        }

        .error {

            background: #fef2f2;

            color: #dc2626;

            border: 1px solid #fecaca;

            padding: 11px;

            border-radius: 9px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 13px;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #5b21b6,
                    #7c3aed
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(91, 33, 182, 0.25);
        }

        .link {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #5b21b6;

            text-decoration: none;

            font-size: 14px;
        }

        .link:hover {

            text-decoration: underline;
        }

        .back-home {

            margin-top: 10px;
        }

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .register-container {

                padding: 30px 22px;

                border-radius: 16px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="register-container">


        <div class="logo">
            🎓
        </div>


        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            AI Smart College Assistant
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button type="submit">
                Register
            </button>


        </form>


        <a
            href="/login/"
            class="link"
        >
            Already have an account? Sign In
        </a>


        <a
            href="/"
            class="link back-home"
        >
            ← Back to Home
        </a>


    </div>


</body>

</html>
